<p-dialog
  draggable="false"
  header="Поповнити скриню"
  [modal]="true"
  [(visible)]="dialogVisible"
  (visibleChange)="onDialogVisibleChange($event)"
  [style]="{ width: '28rem' }">

  <div *ngIf="isLoading" class="loading-hint">Завантаження рахунків...</div>

  <form *ngIf="!isLoading" [formGroup]="depositForm" class="modal-form">
    <div class="field">
      <label class="field-label">Рахунок для списання</label>
      <select
        formControlName="senderAccountId"
        class="field-select"
        (change)="onAccountChange()">
        <option value="" disabled>Оберіть рахунок</option>
        <option *ngFor="let acc of accounts" [value]="acc.id">
          {{ acc.currency }} · {{ acc.balance | currency:acc.currency:'symbol':'1.2-2' }}
        </option>
      </select>
    </div>

    <div *ngIf="selectedAccount" class="balance-hint">
      Поточний залишок:
      <strong>{{ selectedAccount.balance | currency:selectedAccount.currency:'symbol':'1.2-2' }}</strong>
    </div>

    <div class="field">
      <label class="field-label">Сума поповнення</label>
      <div class="amount-wrapper">
        <span class="amount-currency">{{ selectedAccount?.currency ?? 'UAH' }}</span>
        <input
          type="number"
          formControlName="amount"
          class="field-input amount-input"
          placeholder="0.00"
          min="0.01"
          step="0.01" />
      </div>
      <div *ngIf="getAmountError()" class="field-error">{{ getAmountError() }}</div>
    </div>

    <div *ngIf="serverError" class="server-error">{{ serverError }}</div>

    <div class="modal-actions">
      <button type="button" class="cancel-btn" (click)="close()">Скасувати</button>
      <button
        type="button"
        class="submit-btn"
        [disabled]="isSubmitting || depositForm.invalid || accounts.length === 0"
        (click)="submit()">
        {{ isSubmitting ? 'Обробка...' : 'Переказати' }}
      </button>
    </div>
  </form>
</p-dialog>
