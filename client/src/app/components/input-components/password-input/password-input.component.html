<p-password
  class="password-input"
  styleClass="w-full"
  [inputId]="resolvedId"
  [placeholder]="placeholder"
  [disabled]="disabled"
  [toggleMask]="true"
  [ngModel]="value"
  (ngModelChange)="onModelChange($event)"
  [ngModelOptions]="{ standalone: true }"
  [attr.autocomplete]="autocomplete"
  (onBlur)="onTouched()"
  [feedback]="showFeedback"
/>
