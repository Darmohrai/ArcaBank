<!-- wallet-widget.component.html -->

<div class="wallet-widget">

  <div class="wallet-widget__header">
    <h2>$ {{currentTotalBalance}}</h2>
    <p (click)="redirectToAccounts()">All Accounts</p>
  </div>

  <div class="wallet-widget__slider">

    <div
      class="wallet-widget__track"
      [style.transform]="'translateX(-' + currentIndex * 100 + '%)'"
    >

      @for (card of cards; track $index) {

        <div class="wallet-widget__slide">

          <div class="wallet-card">

            <div class="wallet-card__top">
              <div>
                <p class="wallet-card__label">Account Type</p>
                <h3>{{ card.type }}</h3>
              </div>

              <div class="wallet-card__circles">
                <span></span>
                <span></span>
              </div>
            </div>

            <div class="wallet-card__bottom">
              <p>{{ card.number }}</p>
              <h4>{{ card.balance }}</h4>

              <div class="wallet-card__arrow">
                ↗
              </div>
            </div>

          </div>

        </div>

      }

    </div>

  </div>

  <div class="wallet-widget__pagination">

    <button
      (click)="prev()"
      [disabled]="currentIndex === 0"
    >
      ‹ Previous
    </button>

    <div class="wallet-widget__dots">

      @for (card of cards; track $index) {
        <span
          class="wallet-widget__dot"
          [class.active]="currentIndex === $index"
          (click)="goTo($index)"
        ></span>
      }

    </div>

    <button
      (click)="next()"
      [disabled]="currentIndex === cards.length - 1"
    >
      Next ›
    </button>

  </div>

</div>
