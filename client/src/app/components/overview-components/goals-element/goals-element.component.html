<div class="goals-widget">

  <div class="goals-widget__top-container">
    <div class="goals-widget__top-container-inner">
      <p class="goals-widget__top-container-goal">
        ₴{{ max | number:'1.0-2' }}
      </p>

      <i
        class="pi pi-pencil"
        style="cursor:pointer"
        (click)="openEditGoalDialog()">
      </i>
    </div>

    <p class="goals-widget__top-container-goal-month">
      {{ monthName }}, {{ year }}
    </p>
  </div>

  <div class="goals-widget__bottom-container">

    <div class="goals-widget__targets-container">

      <div class="goals-widget__target-achieved">
        <p class="target-text">Поточний чистий дохід:</p>
        <p class="target-text-value">
          ₴{{ value | number:'1.0-2' }}
        </p>
      </div>

      <div class="goals-widget__target">
        <p class="target-text">Ціль:</p>
        <p class="target-text-value">
          ₴{{ max | number:'1.0-2' }}
        </p>
      </div>

    </div>

    <div class="goals-widget__target-chart-continer">
      <div class="gauge">

        <svg viewBox="0 0 200 120">

          <path
            class="gauge__bg"
            d="M20 100 A80 80 0 0 1 180 100"
          />

          <path
            class="gauge__progress"
            d="M20 100 A80 80 0 0 1 180 100"
            [style.stroke-dasharray]="circumference"
            [style.stroke-dashoffset]="dashOffset"
          />

          <g
            class="gauge__needle"
            [style.transform]="'rotate(' + angle + 'deg)'"
          >
            <line x1="100" y1="100" x2="145" y2="55"/>
            <circle cx="100" cy="100" r="6"/>
          </g>

        </svg>

        <div class="gauge__labels">
          <span>₴0</span>
          <span>₴{{ max | number:'1.0-0' }}</span>
        </div>
        <strong class="goal__value">{{ valueLabel }}</strong>

      </div>
    </div>

  </div>

  <p-dialog
    header="Фінансова ціль"
    [(visible)]="isEditGoalDialogVisible"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: '400px' }">

    <div class="goal-dialog-content">

      <label style="margin-right: 15px">Нова ціль</label>

      <p-inputNumber
        [(ngModel)]="goalAmountInput"
        mode="currency"
        currency="UAH"
        locale="en-US"
        [min]="0">
      </p-inputNumber>

    </div>

    <ng-template pTemplate="footer">

      <div class="dialog__btns-container">

        <button  (click)="isEditGoalDialogVisible = false" class="cancelBtn">Скасувати</button>

        <button class="saveBtn" (click)="saveGoal()">Зберегти</button>

      </div>

    </ng-template>

  </p-dialog>

</div>
