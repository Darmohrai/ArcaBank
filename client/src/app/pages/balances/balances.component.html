<section class="balances">

  <div class="balances__create-account-container">
    <p>Потрібен рахунок? <span (click)="showAccountCreationDialog()">Створіть його!</span></p>
  </div>

  <div class="balances__tabs-container">
    <p-tabView [(activeIndex)]="activeTabIndex">
      <p-tabPanel
        *ngFor="let tab of accountTabs"
        [header]="tab.account.currency + ' · ' + tab.account.balance">

        <div class="balances__cards-grid">

          <div
            class="balances__card"
            [class.currency-uah]="tab.account.currency === 'UAH'"
            [class.currency-usd]="tab.account.currency === 'USD'"
            [class.currency-eur]="tab.account.currency === 'EUR'"
            *ngFor="let card of tab.cards">
            <div class="balances__card-top">
              <p class="balances__card-title">ArcaBank</p>
              <div class="balances__card-network" aria-hidden="true">
                <span></span>
                <span></span>
              </div>
            </div>

            <div class="balances__card-chip-row">
              <div class="balances__card-chip" aria-hidden="true">
                <span></span>
                <span></span>
              </div>
              <p class="balances__card-currency">{{ tab.account.currency }}</p>
            </div>

            <p class="balances__card-number">{{ formatCardNumber(card.cardNumber) }}</p>

            <div class="balances__card-bottom">
              <div>
                <p class="balances__card-label">Card holder</p>
                <p class="balances__card-holder">{{ card.cardHolderName }}</p>
              </div>

              <div>
                <p class="balances__card-label">Valid thru</p>
                <p class="balances__card-date">{{ card.expirationDate }}</p>
              </div>
            </div>
          </div>

          <button class="balances__create-account-btn" (click)="showCardCreationDialog()" type="button" aria-label="Create card">
            <span>+</span>
          </button>

        </div>
      </p-tabPanel>
    </p-tabView>
  </div>


  <!-- Діалог створення рахунку -->
  <p-dialog draggable="false" header="Створити рахунок" [modal]="true"
            [(visible)]="visibleAccountCreation" [style]="{ width: '25rem' }">
    <form class="balances__form" [formGroup]="createAccountForm" (ngSubmit)="submitAccountCreationForm()">
      <div class="balances__form-select-container">
        <select class="balances__form-select" formControlName="currency">
          <option value="UAH">UAH</option>
          <option value="EUR">EUR</option>
          <option value="USD">USD</option>
        </select>
      </div>
      <div class="balances__form-select-container">
        <select class="balances__form-select" formControlName="type">
          <option value="CREDIT">CREDIT</option>
          <option value="CHECKING">CHECKING</option>
          <option value="SAVINGS">SAVINGS</option>
        </select>
      </div>
      <button class="balances__form-submit-btn" type="submit">створити</button>
      <button class="balances__form-cancel-btn" type="button" (click)="visibleAccountCreation = false">відміна</button>
    </form>
  </p-dialog>


  <!-- Діалог створення картки -->
  <p-dialog draggable="false" header="Створити картку" [modal]="true"
            [(visible)]="visibleCardCreation" [style]="{ width: '25rem' }">
    <form class="balances__form" [formGroup]="createCardForm" (ngSubmit)="submitCardCreationForm()">

      <div class="balances__form-input-container">
        <input
          class="balances__form-input"
          type="password"
          formControlName="pin"
          placeholder="Введіть PIN-код (4 цифри)"
          maxlength="4"
          inputmode="numeric"
        />
        <small
          *ngIf="createCardForm.controls.pin.invalid && createCardForm.controls.pin.touched">
          PIN-код має містити рівно 4 цифри
        </small>
      </div>

      <button
        class="balances__form-submit-btn"
        type="submit"
        [disabled]="createCardForm.invalid">
        створити
      </button>
      <button class="balances__form-cancel-btn" type="button" (click)="visibleCardCreation = false">відміна</button>
    </form>
  </p-dialog>


  <p-toast/>

</section>
