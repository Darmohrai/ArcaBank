services:
  # --- Database & Management ---
  postgres:
    image: postgres:16-alpine
    container_name: arcabank_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5433}:5432"
    networks:
      - arcabank_net
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh

  pgadmin:
    image: dpage/pgadmin4
    container_name: arcabank_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - arcabank_net
    depends_on:
      - postgres

  # --- Identity & Access Management ---
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: arcabank_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/arcabank_keycloak
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    networks:
      - arcabank_net
    volumes:
      - ./deploy/arcabank-realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      - postgres

  # --- Message Broker (Confluent Kafka + Zookeeper) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: arcabank_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - arcabank_net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: arcabank_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - arcabank_net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: arcabank_kafka_ui
    ports:
      - "8090:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - arcabank_net

  # --- Microservices ---
  api-gateway:
    build:
      context: ./server
      dockerfile: api-gateway/Dockerfile
    container_name: arcabank_gateway
    ports:
      - "80:8080"
    networks:
      - arcabank_net
    depends_on:
      - core-service
      - auth-service

  core-service:
    build:
      context: ./server
      dockerfile: core-finance/Dockerfile
    container_name: arcabank_core-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/arcabank_core
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - arcabank_net
    depends_on:
      - postgres
      - kafka

  auth-service:
    build:
      context: ./server
      dockerfile: auth-service/Dockerfile
    container_name: arcabank_auth
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/arcabank_auth
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      KC_ISSUER_URI: http://keycloak:8080/realms/arcabank
    ports:
      - "8081:8081"
      - "9091:9091"
    networks:
      - arcabank_net
    depends_on:
      - postgres
      - keycloak

  notification-service:
    build:
      context: ./server
      dockerfile: notification-service/Dockerfile
    container_name: arcabank_notification
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/arcabank_notif
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - arcabank_net
    depends_on:
      - postgres
      - kafka

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: arcabank_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    networks:
      - arcabank_net
    depends_on:
      - api-gateway

networks:
  arcabank_net:
    driver: bridge

volumes:
  pgdata:
  kafka_data:
