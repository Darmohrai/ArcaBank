services:
  postgres:
    image: postgres:16-alpine
    container_name: arcabank_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5433}:5432"
    networks:
      - arcabank_net
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh

  pgadmin:
    image: dpage/pgadmin4
    container_name: arcabank_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - arcabank_net
    depends_on:
      - postgres

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: arcabank_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/arcabank_keycloak
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    networks:
      - arcabank_net
    volumes:
      - ./deploy/arcabank-realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      - postgres

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: arcabank_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - arcabank_net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: arcabank_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - arcabank_net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: arcabank_kafka_ui
    ports:
      - "8090:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - arcabank_net

  config-server:
    build:
      context: ./server
      dockerfile: config-server/Dockerfile
    container_name: arcabank_config
    ports:
      - "8888:8888"
    environment:
      - SPRING_CLOUD_CONFIG_SERVER_GIT_URI=https://github.com/Darmohrai/ArcaBankConfig
      - SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL=master
      - ENCRYPT_KEY=${CONFIG_ENCRYPT_KEY:-great-acorns-team-key-2026}
    networks:
      - arcabank_net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 20s
      timeout: 30s
      retries: 5
      start_period: 60s

  api-gateway:
    build:
      context: ./server
      dockerfile: api-gateway/Dockerfile
    container_name: arcabank_gateway
    ports:
      - "80:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    networks:
      - arcabank_net
    depends_on:
      config-server:
        condition: service_healthy
      core-service:
        condition: service_started
      auth-service:
        condition: service_started

  core-service:
    build:
      context: ./server
      dockerfile: core-finance/Dockerfile
    container_name: arcabank_core-service
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    networks:
      - arcabank_net
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_started
      kafka:
        condition: service_started

  auth-service:
    build:
      context: ./server
      dockerfile: auth-service/Dockerfile
    container_name: arcabank_auth
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    ports:
      - "8081:8081"
      - "9091:9091"
    networks:
      - arcabank_net
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_started
      keycloak:
        condition: service_started

  notification-service:
    build:
      context: ./server
      dockerfile: notification-service/Dockerfile
    container_name: arcabank_notification
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    networks:
      - arcabank_net
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_started
      kafka:
        condition: service_started

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: arcabank_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    networks:
      - arcabank_net
    depends_on:
      - api-gateway

networks:
  arcabank_net:
    driver: bridge

volumes:
  pgdata:
  kafka_data:
