server:
  port: 8081

spring:
  application:
    name: auth-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/arcabank
          jwk-set-uri: http://keycloak:8080/realms/arcabank/protocol/openid-connect/certs

grpc:
  server:
    port: 9091
