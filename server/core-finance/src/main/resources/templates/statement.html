<html>
<head>
    <meta charset="UTF-8" />
    <style>
        body { color: #333; }
        .header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        .income { color: green; }
        .expense { color: red; }
    </style>
</head>
<body>

<div class="header">
    <h1>Виписка по рахунку</h1>
    <p>ArcaBank: Надійність та інновації</p>
</div>

<p><strong>Клієнт:</strong> <span th:text="${userName}">Іван Іванов</span></p>
<p><strong>Рахунок (IBAN):</strong> <span th:text="${iban}">UA...</span></p>
<p><strong>Поточний баланс:</strong> <span th:text="${balance}">0.00</span> <span th:text="${currency}">UAH</span></p>

<table>
    <thead>
    <tr>
        <th>Дата</th>
        <th>Тип</th>
        <th>Сума</th>
        <th>Статус</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="tx : ${transactions}">
        <td th:text="${#temporals.format(tx.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2026</td>
        <td th:text="${tx.type}">EXPENSE</td>
        <td th:class="${tx.type == 'INCOME' ? 'income' : 'expense'}"
            th:text="${tx.type == 'INCOME' ? '+' + tx.amount : '-' + tx.amount}">100</td>
        <td th:text="${tx.status}">SUCCESS</td>
    </tr>
    </tbody>
</table>

</body>
</html>
